name: Odoo tani

# Veritabani adini ve baglanti durumunu ogrenir. Hicbir sey yazmaz, anahtar istemez.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Odoo adresi'
        required: false
        default: 'https://isthac.istanbulpromo.com'

permissions:
  contents: read

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Aday veritabani adlarini dene
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PYEOF'
          import os, xmlrpc.client
          u = os.environ["URL"].rstrip("/")
          ortak = xmlrpc.client.ServerProxy(u + "/xmlrpc/2/common", allow_none=True)
          adaylar = ["isthac", "isthac.istanbulpromo.com", "istanbulpromo", "isthac_odoo",
                     "isthacdb", "odoo", "isthac18", "isthac-18", "hacumre", "istanbulhacumre"]
          for d in adaylar:
              try:
                  sonuc = ortak.authenticate(d, "deneme@yok.invalid", "yanlis", {})
                  print(f"  VAR    {d!r:34s} -> veritabani mevcut (kimlik yanlis: {sonuc})")
              except Exception as e:
                  m = str(e).replace("\n", " ")[:120]
                  isaret = "YOK   " if "does not exist" in m or "veritaban" in m.lower() else "?     "
                  print(f"  {isaret} {d!r:34s} -> {m}")
          PYEOF

      - name: Sor
        env:
          URL: ${{ inputs.url }}
        run: |
          set -u
          U="${URL%/}"
          echo "== 1) jsonrpc db.list =="
          curl -sS -m 25 -X POST "$U/jsonrpc" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"call","params":{"service":"db","method":"list","args":[]},"id":1}' \
            | head -c 600; echo
          echo
          echo "== 2) /web/database/list =="
          curl -sS -m 25 -X POST "$U/web/database/list" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"call","params":{}}' | head -c 600; echo
          echo
          echo "== 3) giris sayfasinda gizli db alani =="
          curl -sS -m 25 "$U/web/login" | grep -io 'name="db"[^>]*' | head -5 || echo "(yok)"
          echo
          echo "== 4) surum bilgisi =="
          curl -sS -m 25 -X POST "$U/jsonrpc" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"call","params":{"service":"common","method":"version","args":[]},"id":2}' \
            | head -c 400; echo
