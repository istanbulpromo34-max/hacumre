name: Katalog senkronu

# Her gece Türkiye saatiyle 03:05'te ürünleri tazeler, değişiklik varsa depoya yazar.
# GitHub cron'u UTC çalışır: 00:05 UTC = 03:05 İstanbul.
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Deneme için ürün sayısı (boş = tamamı)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Ürünleri çek
        run: node sync.mjs ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Değişiklikleri yaz
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            git config user.name "katalog-bot"
            git config user.email "katalog-bot@users.noreply.github.com"
            git add docs/data
            git commit -m "Katalog güncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          else
            echo "Değişiklik yok."
          fi
