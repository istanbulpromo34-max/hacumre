name: Google puanini guncelle

# Her gun Google Places'ten magazanin puanini ve yorum sayisini alip siteye yazar.
# Anahtar depo ayarlarinda GOOGLE_PLACES_KEY adiyla duruyor.
on:
  schedule:
    - cron: '17 4 * * *'      # her gun 04:17 UTC (Turkiye 07:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foto                 # diger botlarla ayni grup: ayni anda yazmasinlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Puani al ve siteye yaz
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python tools/puan_al.py

      - name: Depoya yaz
        run: |
          # Yalnizca var olan dosyalari ekle: yorum dosyasi her calismada olusmayabilir
          YOLLAR=""
          for d in docs/puan.json docs/yorumlar.json docs/site.js docs/index.html docs/iletisim.html; do
            [ -e "$d" ] && YOLLAR="$YOLLAR $d"
          done
          git config user.name "puan-bot"
          git config user.email "puan-bot@users.noreply.github.com"
          git add -A $YOLLAR
          if [ -z "$(git status --porcelain $YOLLAR)" ]; then
            echo "Puan degismemis."; exit 0
          fi
          git commit -m "Google puani guncellendi"
          for deneme in 1 2 3 4 5; do
            if git push; then echo "yazildi (deneme $deneme)"; exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 6 + 3))
          done
          echo "::error::Depoya yazilamadi"; exit 1
