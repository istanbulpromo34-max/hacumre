name: Foto temizle

# gelen/ klasörüne ham fotoğraf düştüğünde arkaplanı temizler,
# 2K beyaz zeminli görsele çevirir, siteye ve Odoo ürün kartına yazar.
on:
  push:
    paths: ['gelen/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foto
  cancel-in-progress: false

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use

      - name: Kurulum
        run: pip install --quiet pillow "rembg[cpu]==2.0.59" onnxruntime

      - name: Temizle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
        run: python tools/foto_temizle.py

      - name: Depoya yaz
        run: |
          git config user.name "foto-bot"
          git config user.email "foto-bot@users.noreply.github.com"
          git add -A docs/assets/u gelen
          if [ -z "$(git status --porcelain docs/assets/u gelen)" ]; then
            echo "Değişiklik yok."; exit 0
          fi
          git commit -m "Ürün fotoğrafları temizlendi"
          # Aynı anda başka bir iş de yazmış olabilir; çakışırsa bizim taze
          # görselimiz geçerli olsun ve birkaç kez tekrar denensin.
          for deneme in 1 2 3 4 5; do
            if git push; then echo "yazıldı (deneme $deneme)"; exit 0; fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs -- docs/assets/u gelen 2>/dev/null || true
              git add -A docs/assets/u gelen
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((RANDOM % 6 + 3))
          done
          echo "::error::Depoya yazılamadı"; exit 1
