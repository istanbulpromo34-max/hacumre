name: Alan adi tanisi
on:
  workflow_dispatch:
    inputs:
      alan: { description: 'Alan adı', required: false, default: 'istanbulhacumre.com' }
permissions:
  contents: read
jobs:
  bak:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: DNS kayitlari
        env:
          ALAN: ${{ inputs.alan }}
        run: |
          set +e
          echo "== A =="        ; dig +short A    "$ALAN"
          echo "== AAAA =="     ; dig +short AAAA "$ALAN"
          echo "== CNAME www ==" ; dig +short CNAME "www.$ALAN"; dig +short A "www.$ALAN"
          echo "== NS =="       ; dig +short NS   "$ALAN"
          echo "== MX =="       ; dig +short MX   "$ALAN"
          echo "== whois ozet =="
          whois "$ALAN" 2>/dev/null | grep -iE "registrar:|creation|expir|status:|name server" | head -12
          echo "== yonlendirme zinciri =="
          for u in "http://$ALAN/" "https://$ALAN/" "https://www.$ALAN/" "https://istanbulpromo34-max.github.io/hacumre/"; do
            printf "%-52s " "$u"
            curl -sS -m 20 -o /dev/null -w "%{http_code} -> %{redirect_url}  [son: %{url_effective} %{http_code}]\n" "$u" || echo "ulasilamadi"
          done
          echo "== son adres (yonlendirmeleri izleyerek) =="
          for u in "http://$ALAN/" "https://www.$ALAN/" "https://istanbulpromo34-max.github.io/hacumre/"; do
            printf "%-52s " "$u"
            curl -sS -m 20 -o /dev/null -L -w "%{url_effective} (%{http_code})\n" "$u" || echo "ulasilamadi"
          done
          echo "== icerik ve dosyalar =="
          curl -sS -m 20 -L "https://$ALAN/" | grep -o "<title>[^<]*</title>" | head -1
          for d in "/sitemap.xml" "/robots.txt" "/CNAME" "/assets/tanitim/film.mp4" "/urunler.html" "/tur.html" "/iletisim.html" "/admin/"; do
            printf "%-34s " "$d"
            curl -sS -m 25 -o /dev/null -L -w "%{http_code} %{size_download}b %{content_type}\n" "https://$ALAN$d"
          done
