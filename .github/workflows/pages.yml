name: Siteyi yayınla

# docs/ klasörünü GitHub Pages'e yayınlar. Katalog senkronu docs/data'yı
# güncellediğinde bu akış kendiliğinden tetiklenir ve site tazelenir.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages'i hazırla (gerekirse aç)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Tarayici eski js/css dosyasini onbellekten kullanmasin diye her yayinda
      # yerel baglantilarin sonuna o commit'in kisa kimligi ekleniyor. Kaynak
      # dosyalar degismiyor; yalniz yayinlanan kopya damgalaniyor.
      - name: Dosya baglantilarini damgala
        run: |
          V="${GITHUB_SHA::8}"
          for d in site.css site.js yorumlar.js urunler-veri.js hava.js; do
            grep -rl --include='*.html' "\"$d\"" docs | while read -r f; do
              sed -i "s|\"$d\"|\"$d?v=$V\"|g" "$f"
            done
          done
          echo "Damga: $V"
          grep -o 'site\.js?v=[a-f0-9]*' docs/index.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
