name: OpenAI tani
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Modelleri listele
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "== gorsel modelleri =="
          curl -sS -m 30 https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
          | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'error' in d:
              print('HATA:', json.dumps(d['error'], ensure_ascii=False)[:400]); raise SystemExit
          adlar = sorted(m['id'] for m in d.get('data', []))
          g = [a for a in adlar if any(k in a for k in ('image', 'dall'))]
          print('toplam model:', len(adlar))
          print('gorsel modelleri:', g or '(yok)')
          print('ornek digerleri:', adlar[:12])
          "
